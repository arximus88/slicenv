# Snap Slicenv. НЕ зібрано локально (snapcraft не встановлено, потрібен LXD/Multipass).
# Збирати з кореня репозиторію: snapcraft pack --project-dir . (або скопіювати цей файл
# у snap/snapcraft.yaml).
#
# Чому classic confinement:
#  * рушії нарізки (OrcaSlicer / Bambu Studio) завантажуються як AppImage, розпаковуються
#    й запускаються з ~/.local/share/slicenv — strict-snap не дає виконувати власні
#    бінарники з $HOME і не має потрібних бібліотек рушіїв у base;
#  * закритий плагін Bambu (libbambu_networking.so) підключається через dlopen і тягне
#    бібліотеки хоста (libstdc++, OpenSSL, libcurl) — у strict їх немає;
#  * сесії й профілі Bambu Studio / OrcaSlicer лежать у ~/.config/BambuStudio тощо
#    (прихований каталог у $HOME — інтерфейс home їх не відкриває);
#  * LAN-виявлення принтерів слухає UDP 2021 (SSDP від принтера).
# Classic вимагає ручного схвалення в Snap Store (запит на forum.snapcraft.io).
name: slicenv
base: core24
version: '0.1.6'
summary: 3D printing slicer front-end for OrcaSlicer / Bambu Studio engines
description: |
  Slicenv arranges and orients models on build plates, edits print, filament and
  printer profiles and drives OrcaSlicer or Bambu Studio command-line engines to
  produce G-code, with a fast GPU preview. Includes slicenv-mcp, an MCP server for
  AI agents. Engines and the proprietary Bambu network plugin are not included;
  they are downloaded on demand, the plugin only with the user's consent.
license: AGPL-3.0-or-later
grade: devel
confinement: classic
platforms:
  amd64:

apps:
  slicenv:
    command: usr/bin/slicenv
    desktop: usr/share/applications/app.borys.slicenv.desktop
    common-id: app.borys.slicenv
  mcp:
    command: usr/bin/slicenv-mcp

parts:
  slicenv:
    plugin: rust
    source: .
    rust-channel: '1.100.0'
    rust-cargo-parameters: [--locked]
    override-build: |
      cargo build --release --locked -p app -p mcp
      install -Dm755 target/release/slicenv $CRAFT_PART_INSTALL/usr/bin/slicenv
      install -Dm755 target/release/slicenv-mcp $CRAFT_PART_INSTALL/usr/bin/slicenv-mcp
      A=crates/app/assets/app
      sed 's|@EXEC@|slicenv|' $A/app.borys.slicenv.desktop \
        | sed 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/app.borys.slicenv.svg|' \
        > app.borys.slicenv.desktop
      install -Dm644 app.borys.slicenv.desktop $CRAFT_PART_INSTALL/usr/share/applications/app.borys.slicenv.desktop
      install -Dm644 $A/app.borys.slicenv.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/app.borys.slicenv.metainfo.xml
      install -Dm644 $A/slicenv.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/app.borys.slicenv.svg
      install -Dm644 -t $CRAFT_PART_INSTALL/usr/share/doc/slicenv LICENSE THIRD-PARTY-NOTICES.md packaging/THIRD-PARTY-RUST-CRATES.md
    build-packages:
      - pkg-config
      - cmake
      - clang
      - git
      - libssl-dev
      - libzstd-dev
      - libfontconfig-dev
      - libfreetype-dev
      - libwayland-dev
      - libxkbcommon-dev
      - libxkbcommon-x11-dev
      - libx11-xcb-dev
      - libxcb1-dev
    # Classic-snap бере бібліотеки з хоста, але явний перелік потрібен для ld-перевірок
    # snapcraft і для хостів без них.
    stage-packages:
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libxcb-xkb1
      - libwayland-client0
      - libvulkan1
      - squashfs-tools
