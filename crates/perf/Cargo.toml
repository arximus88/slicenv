[package]
name = "perf"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish = false
default-run = "perf"

# Бюджети продуктивності без вікна: `cargo run --release -p perf` (див. docs/TESTING.md).
[[bin]]
name = "perf"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gcode.workspace = true
glam.workspace = true
project.workspace = true
serde_json.workspace = true
viewer.workspace = true
paths.workspace = true
slicer.workspace = true
tempfile.workspace = true

# Розклад однієї нарізки на етапи без вікна (docs/BENCHMARK.md, «Розклад нарізки»).
[[bin]]
name = "slice-profile"
path = "src/slice_profile.rs"
