[package]
name = "lan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Режим LAN для принтерів Bambu Lab на чистому Rust: без закритого плагіна й акаунта.
[dependencies]
paths.workspace = true
cloud.workspace = true
serde.workspace = true
serde_json.workspace = true
# Лише ring: aws-lc-rs потребує cmake/nasm і дав би два провайдери в одному процесі.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
x509-parser = "0.17"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
socket2 = { version = "0.6", features = ["all"] }
md-5 = "0.10"

[dev-dependencies]
tempfile.workspace = true
